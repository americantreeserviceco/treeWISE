name: treeWISE tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax-check server modules
        run: |
          node --check server.mjs
          node --check knowledge.mjs
          node --check inquiries.mjs
          node --check staff.mjs
          node --check auth.mjs
          node --check postgres.mjs
          node --check scripts/create-staff.mjs
      - name: Run unit tests
        run: npm test
